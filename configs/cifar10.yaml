# Inherit-by-copy of default.yaml with dataset swapped to CIFAR-10.
# Requires: pip install torch torchvision (and network access for the
# first run, which auto-downloads the dataset via torchvision).
run_id: cifar10_run
seed: 42
output_dir: outputs

dataset:
  name: cifar10
  root: ./data
  val_split: 0.15
  test_split: 0.15

partition:
  strategy: dirichlet
  dirichlet_alpha: 0.5

privacy:
  enabled: true
  mechanism: gaussian
  epsilon: 1.0
  delta: 0.00001
  clip_norm: 1.0
  accountant: analytic_gaussian

network:
  simulate: true
  base_latency_ms: 20.0
  latency_jitter_ms: 15.0
  bandwidth_mbps: 10.0
  dropout_prob: 0.05

federated:
  algorithm: fedavg
  n_clients: 40
  client_fraction: 0.75
  n_rounds: 15
  local_epochs: 2
  batch_size: 32
  learning_rate: 0.05
